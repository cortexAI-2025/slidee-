<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="24" fill="#0D1117"/>
  <!-- 3x3 grid tiles -->
  <rect x="8"  y="8"  width="36" height="36" rx="6" fill="#4ECDC4"/>
  <rect x="50" y="8"  width="36" height="36" rx="6" fill="#4ECDC4"/>
  <rect x="92" y="8"  width="28" height="36" rx="6" fill="#4ECDC4"/>
  <rect x="8"  y="50" width="36" height="36" rx="6" fill="#4ECDC4"/>
  <!-- empty tile -->
  <rect x="50" y="50" width="36" height="36" rx="6" fill="#1C2333" stroke="#4ECDC4" stroke-width="2"/>
  <rect x="92" y="50" width="28" height="36" rx="6" fill="#4ECDC4"/>
  <rect x="8"  y="92" width="36" height="28" rx="6" fill="#4ECDC4"/>
  <rect x="50" y="92" width="36" height="28" rx="6" fill="#4ECDC4"/>
  <rect x="92" y="92" width="28" height="28" rx="6" fill="#FF6B6B"/>
</svg>

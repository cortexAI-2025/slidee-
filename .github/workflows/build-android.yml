name: Build Android APK

# Triggers: push on dev branch or main, version tags, and manual dispatch
on:
  push:
    branches:
      - claude/sliding-puzzle-godot-app-A3yo1
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  EXPORT_PRESET: "Android"
  APK_PATH: "build/android/slidee.apk"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  export-android:
    name: Export Android APK
    runs-on: ubuntu-22.04

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java (required by Android SDK tools) ──────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      # ── 3. Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313"

      # ── 4. Godot binaries (cached) ───────────────────────────────────────────
      - name: Cache Godot & export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/godot
            ~/.local/share/godot/export_templates/
          key: godot-${{ env.GODOT_VERSION }}-stable-v1

      - name: Download Godot headless
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip" \
            -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv "/tmp/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Download Godot export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz" \
            -O /tmp/templates.tpz
          cd /tmp && unzip -q templates.tpz
          mv /tmp/templates \
             ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable

      # ── 5. Keystore ──────────────────────────────────────────────────────────
      # Secrets cannot be referenced in step `if:` conditions.
      # We pass them as env vars and branch inside the shell script instead.
      # Optional repo secrets: KEYSTORE_BASE64 (base64 .jks), KEYSTORE_ALIAS, KEYSTORE_PASS
      # If absent a throwaway debug keystore is generated automatically.

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/release.keystore"
            echo "KS_FILE=$HOME/release.keystore" >> "$GITHUB_ENV"
            echo "KS_USER=$KEYSTORE_ALIAS"        >> "$GITHUB_ENV"
            echo "KS_PASS=$KEYSTORE_PASS"         >> "$GITHUB_ENV"
          else
            keytool -genkey -v \
              -keystore "$HOME/debug.keystore" \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "KS_FILE=$HOME/debug.keystore" >> "$GITHUB_ENV"
            echo "KS_USER=androiddebugkey"      >> "$GITHUB_ENV"
            echo "KS_PASS=android"              >> "$GITHUB_ENV"
          fi

      # ── 6. Godot editor settings ─────────────────────────────────────────────
      # Godot reads SDK path and keystore from editor_settings-4.tres, not env vars.

      - name: Write Godot editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$KS_FILE"
          export/android/debug_keystore_user = "$KS_USER"
          export/android/debug_keystore_pass = "$KS_PASS"
          EOF

      # ── 7. Export ────────────────────────────────────────────────────────────
      - name: Create output directory
        run: mkdir -p build/android

      - name: Export APK (debug)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          godot --headless --export-debug "${{ env.EXPORT_PRESET }}" \
            "${{ env.APK_PATH }}" 2>&1 | tee godot_export.log
          echo "--- Export log ---"
          cat godot_export.log
          test -f "${{ env.APK_PATH }}" || (echo "APK not found!" && exit 1)

      - name: Export APK (release, on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          godot --headless --export-release "${{ env.EXPORT_PRESET }}" \
            "${{ env.APK_PATH }}" 2>&1 | tee godot_export.log
          echo "--- Export log ---"
          cat godot_export.log
          test -f "${{ env.APK_PATH }}" || (echo "APK not found!" && exit 1)

      # ── 8. APK info ──────────────────────────────────────────────────────────
      - name: Print APK size
        run: |
          ls -lh "${{ env.APK_PATH }}"
          echo "SHA256: $(sha256sum ${{ env.APK_PATH }} | awk '{print $1}')"

      # ── 9. Upload artifact ───────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: slidee-android-${{ github.sha }}
          path: ${{ env.APK_PATH }}
          retention-days: 30

      # ── 10. GitHub Release (on version tag) ──────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
          name: "Slidee ${{ github.ref_name }}"
          body: |
            ## Slidee ${{ github.ref_name }}

            ### Install
            1. Download `slidee.apk` below
            2. Enable *Install from unknown sources* on your Android device
            3. Install and enjoy 🧩

            > Built with Godot ${{ env.GODOT_VERSION }}
